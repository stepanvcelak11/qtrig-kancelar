<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GeoAR Pro">
  <meta name="theme-color" content="#05101c">
  <meta name="description" content="Simulátor geodetických přístrojů: totální stanice, nivelační přístroje, GNSS rovery.">
  <title>GeoAR Pro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="scene"></canvas>
  <canvas id="handLayer"></canvas>

  <!-- Horní lišta: vybavení, stav, údaje, přepínače -->
  <header id="topbar" class="glass hidden">
    <button id="catalogBtn" class="primary">＋ Vybavení</button>
    <div id="status" class="status">
      <div id="title" class="title">GeoAR Pro</div>
      <div id="pill" class="pill hidden"></div>
    </div>
    <div id="readout" class="readout"></div>
    <div class="spacer"></div>
    <button id="modeBtn" class="chip">🧊 3D</button>
    <button id="handBtn" class="chip hidden">✋</button>
    <button id="unitBtn" class="chip">gon</button>
  </header>

  <!-- Nápověda pod lištou -->
  <div id="hint" class="hint hidden"></div>

  <!-- Pravý panel: ovládání přístroje -->
  <aside id="panel" class="glass hidden"></aside>

  <!-- Joystick pro chůzi -->
  <div id="joy" class="hidden"><div id="joyKnob"></div><span>Chůze</span></div>

  <!-- Katalog vybavení (okno) -->
  <section id="catalog" class="modal hidden">
    <div class="sheet glass">
      <div class="row">
        <div class="seg" id="catSeg"></div>
        <div class="spacer"></div>
        <button id="catalogClose" class="round">✕</button>
      </div>
      <div class="catbody">
        <div id="cards" class="cards"></div>
        <div id="specs" class="specs"></div>
      </div>
      <button id="placeBtn" class="primary big">Postavit před sebe</button>
    </div>
  </section>

  <!-- Pohled dalekohledem -->
  <section id="telescope" class="hidden">
    <div id="eyepiece">
      <canvas id="telVideo"></canvas>
      <canvas id="telScene"></canvas>
      <canvas id="reticle"></canvas>
      <div class="vignette"></div>
    </div>
    <div class="telside">
      <div class="row"><div class="title grow">Pohled dalekohledem</div><button id="telExit" class="round">✕</button></div>
      <div id="telSub" class="sub"></div>
      <div id="telReadout" class="grid"></div>
      <div class="jogs">
        <div class="jog" data-jog="h"><span>◀ Hz ustanovka ▶</span><canvas></canvas></div>
        <div class="jog" data-jog="v" id="jogV"><span>▲ V ustanovka ▼</span><canvas></canvas></div>
        <div class="jog" data-jog="f"><span>Ostření</span><canvas></canvas></div>
      </div>
      <div class="row gap"><span>🔍</span><input id="zoom" type="range" min="10" max="30" step="1" value="30"><span id="zoomText" class="mono">30×</span>
        <button id="afBtn" class="chip">AF</button></div>
    </div>
  </section>

  <!-- Úvod -->
  <section id="start" class="screen">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>GeoAR Pro</h1>
    <p class="sub">Simulátor geodetických přístrojů</p>
    <div class="row gap wrap">
      <button id="start3D" class="primary big">🧊 Hrát ve 3D</button>
      <button id="startAR" class="big">📷 Hrát s kamerou (AR)</button>
    </div>
    <p class="tiny">Chůze joystickem vlevo dole · rozhlížení tažením prstu (v AR otáčením telefonu) · přístroj ovládáte panelem vpravo.</p>
  </section>

  <div id="toast" class="glass hidden"></div>

  <section id="rotate">
    <div class="phone">📱</div>
    <div class="title">Otočte telefon na šířku</div>
    <div class="sub">GeoAR Pro se hraje na šířku.</div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
