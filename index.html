<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QTRIG Kancelář</title>
<meta name="description" content="Geodetické výpočty pro PC i mobil: seznam souřadnic, zápisník z totální stanice, polární metoda, polygonový pořad, protínání, transformace, mezní odchylky a protokol.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B222B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('qk-tema');if(t&&t!=='"system"')document.documentElement.dataset.theme=JSON.parse(t);else if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark';}catch(e){}</script>
</head>
<body>
<header class="lista">
  <div class="logo"><span class="q">Q</span><span class="t">QTRIG Kancelář</span></div>
  <div class="projekt"><button class="btn tichy" id="btn-projekt" title="Projekt">Projekt ▾</button></div>
  <div class="stav" id="stav-ulozeni"></div>
  <button class="btn tichy maly" id="btn-ucet" title="Účet QTRIG a most do AR Geodetu">Účet</button>
  <button class="ikona" id="btn-tema" title="Tmavý / světlý motiv" aria-label="Přepnout motiv">◐</button>
  <button class="ikona" id="btn-napoveda" title="Nápověda" aria-label="Nápověda">?</button>
</header>

<main class="plocha" id="plocha">
  <aside class="panel" id="panel-levy" aria-label="Seznamy">
    <div class="zalozky" role="tablist">
      <button role="tab" data-tab="body" aria-selected="true">Body<span class="poc" id="poc-body"></span></button>
      <button role="tab" data-tab="zapisnik" aria-selected="false">Zápisník<span class="poc" id="poc-zapisnik"></span></button>
      <button role="tab" data-tab="vypocty" aria-selected="false">Výpočty<span class="poc" id="poc-vypocty"></span></button>
    </div>
    <div class="obsah">
      <section id="sekce-body" class="aktivni"></section>
      <section id="sekce-zapisnik"></section>
      <section id="sekce-vypocty"></section>
    </div>
  </aside>
  <div class="delic" data-delic="1" role="separator" aria-orientation="vertical"></div>
  <section class="panel" id="panel-stred" aria-label="Pracovní plocha">
    <div class="zalozky" id="stred-zalozky" role="tablist"></div>
    <div class="obsah" id="stred-obsah"></div>
  </section>
  <div class="delic" data-delic="3" role="separator" aria-orientation="vertical"></div>
  <aside class="panel" id="panel-pravy" aria-label="Mapa a protokol">
    <div class="zalozky" role="tablist">
      <button role="tab" data-tab="mapa" aria-selected="true">Mapa</button>
      <button role="tab" data-tab="protokol" aria-selected="false">Protokol</button>
    </div>
    <div class="obsah">
      <section id="sekce-mapa" class="aktivni"><div class="mapa-obal"><canvas id="mapa-canvas"></canvas><div class="mapa-info" id="mapa-info"></div><div class="mapa-tl"><button class="btn maly" id="mapa-vse" title="Zobrazit vše">⤢</button></div></div></section>
      <section id="sekce-protokol"></section>
    </div>
  </aside>
</main>

<nav class="mobil-tabs" aria-label="Části aplikace">
  <button data-mobil="panel-levy" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Seznamy</button>
  <button data-mobil="panel-stred" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Práce</button>
  <button data-mobil="panel-pravy" data-tab="mapa" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
  <button data-mobil="panel-pravy" data-tab="protokol" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>Protokol</button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
