# XcodeGen project specification — run `xcodegen generate` to create GeoARPro.xcodeproj
name: GeoARPro
options:
  bundleIdPrefix: com.geoarpro
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  GeoARPro:
    type: application
    platform: iOS
    sources:
      - path: GeoARPro
    settings:
      base:
        PRODUCT_NAME: GeoAR Pro
        PRODUCT_BUNDLE_IDENTIFIER: com.geoarpro.surveying-simulator
        INFOPLIST_FILE: GeoARPro/Resources/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE

  SurveyingCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SurveyingCoreTests
      # Framework-free core compiled directly into the test bundle.
      - path: GeoARPro/Utilities/GeodeticMath.swift
      - path: GeoARPro/Utilities/OneEuroFilter.swift
      - path: GeoARPro/Models/EquipmentCatalog.swift
      - path: GeoARPro/Models/MeasurementModels.swift
      - path: GeoARPro/Interactions/SurveyingKinematics.swift
      - path: GeoARPro/Services/GNSSSimulator.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.geoarpro.surveying-core-tests
        CODE_SIGN_IDENTITY: "-"

schemes:
  GeoARPro:
    build:
      targets:
        GeoARPro: all
    run:
      config: Debug
    archive:
      config: Release
  SurveyingCoreTests:
    build:
      targets:
        SurveyingCoreTests: [test]
    test:
      config: Debug
      targets:
        - SurveyingCoreTests
